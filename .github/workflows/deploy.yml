name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Sync Articles to Next.js
        run: |
          echo "Syncing /articles to my-app/public/articles..."
          rm -rf my-app/public/articles
          cp -r articles my-app/public/articles
          echo "✅ Articles synced"

      - name: Sync Milestones to Next.js
        run: |
          echo "Syncing /milestones to my-app/public/milestones..."
          rm -rf my-app/public/milestones
          cp -r milestones my-app/public/milestones
          echo "✅ Milestones synced"

      - name: Install Dependencies
        run: cd my-app && npm ci

      - name: Setup Database
        run: cd my-app && npx prisma generate

      - name: Build
        run: cd my-app && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./my-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
